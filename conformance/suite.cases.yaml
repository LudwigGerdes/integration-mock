# S2 conformance fixture — owner: integration-mock. Consumers vendor this verbatim.
# Exercises: file-level defaults, per-case `given` override, both trigger forms,
# call assertions, noUnmatched, and pinData (S8).
workflow: 8f3a
instance: dev
given:
  packs: [slack, api-example-com]
  pinData:
    Webhook:
      - json: { id: 1, email: a@example.com }
cases:
  - id: happy-path
    title: posts one message to the alerts channel
    when:
      trigger: webhook
      payload: { email: a@example.com }
    then:
      execution.status: success
      node.Slack.items: 1
      node.Fetch.output[0].json.id: 1
      calls:
        - service: slack
          method: POST
          path: /api/chat.postMessage
          count: 1
        - service: hubspot
          count: 0
      noUnmatched: true

  - id: slack-down
    title: surfaces the failing node when Slack is unavailable
    given:
      faults:
        slack: { status: 503, after: 1, once: true }
    when:
      trigger: { node: Webhook, payload: { email: b@example.com } }
    then:
      execution:
        status: { errorNode: Slack }

  - id: no-defaults-overridden
    when:
      payload: { email: c@example.com }
    then:
      noUnmatched: true
